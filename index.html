<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossing Times — European border wait reports</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#121212">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #121212;
    --panel: #1B1B1E;
    --panel-2: #202024;
    --line: #2A2A2E;
    --text: #F5F5F7;
    --text-dim: #A8ACB4;
    --text-faint: #6B7280;
    --green: #10B981;
    --green-tint: rgba(16,185,129,0.14);
    --amber: #F59E0B;
    --amber-tint: rgba(245,158,11,0.14);
    --red: #EF4444;
    --red-tint: rgba(239,68,68,0.14);
    --accent: #3B82F6;
    --accent-tint: rgba(59,130,246,0.14);
    --shadow: 0 2px 8px rgba(0,0,0,0.18);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F8F9FA; --panel: #FFFFFF; --panel-2: #F4F5F7; --line: #E5E7EB;
      --text: #111318; --text-dim: #4B5563; --text-faint: #6B7280;
      --shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --panel: #1B1B1E; --panel-2: #202024; --line: #2A2A2E;
    --text: #F5F5F7; --text-dim: #A8ACB4; --text-faint: #6B7280;
    --shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }
  button, select, input { font-family: inherit; }

  /* ---------- Header ---------- */
  header { margin-bottom: 18px; }
  .eyebrow-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-weight: 800; font-size: clamp(26px, 5.5vw, 34px); letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.1; color: var(--text); }
  .tagline { color: var(--text-dim); font-size: 14px; max-width: 56ch; line-height: 1.5; margin: 0; }
  .proto-note { margin-top: 10px; font-size: 12.5px; color: var(--text-faint); border-left: 2px solid var(--accent); padding-left: 9px; }
  .lang-switch select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer;
    min-height: 44px;
  }

  /* ---------- Sticky search + filters ---------- */
  .sticky-bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25;
    background: var(--bg); padding: 10px 0 12px; margin-bottom: 4px;
    border-bottom: 1px solid transparent;
  }
  .sticky-bar.scrolled { border-bottom-color: var(--line); }
  .search-input-wrap { position: relative; margin-bottom: 10px; }
  .search-input {
    width: 100%; min-height: 44px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 0 14px; font-size: 15px; box-shadow: var(--shadow);
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-pill {
    display: inline-flex; align-items: center; min-height: 40px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text-dim);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filter-pill.active { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }

  /* ---------- Map card ---------- */
  .mapcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 0 0 20px; box-shadow: var(--shadow); }
  .mapcard-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 0; }
  .mapcard-head h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1px; margin: 0; color: var(--text); }
  .mapcard-head span { font-size: 12px; color: var(--text-faint); }
  .locate-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px; flex-wrap: wrap; }
  .locate-btn {
    display: inline-flex; align-items: center; min-height: 44px; background: var(--accent-tint); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .locate-btn:disabled { opacity: 0.55; cursor: default; }
  .locate-status { font-size: 12px; color: var(--text-faint); }
  .mapbox { position: relative; width: 100%; aspect-ratio: 10 / 7; z-index: 0; }
  .mapbox .leaflet-container { width: 100%; height: 100%; background: var(--panel-2); font-family: inherit; }
  .mapbox .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border-radius: 12px; }
  .mapbox .leaflet-popup-tip { background: var(--panel); }
  .mapbox .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 13px; margin: 10px 12px; }
  .mapbox .leaflet-popup-content b { font-size: 14.5px; font-weight: 700; }
  .crossing-marker { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .crossing-marker.wait-none { background: var(--text-faint); }
  .crossing-marker.wait-low { background: var(--green); }
  .crossing-marker.wait-mid { background: var(--amber); }
  .crossing-marker.wait-high { background: var(--red); }
  .user-marker-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 5px var(--accent-tint); }

  .map-legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; }
  .legend-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 8px; }
  .legend-pill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* ---------- Board section ---------- */
  .board-section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 10px; }
  .board-section-head h2 { font-size: 15px; font-weight: 700; margin: 0; color: var(--text); }
  .board-section-head span { font-size: 12px; color: var(--text-faint); }
  .cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .cc-card {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow);
  }
  .cc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cc-name { font-weight: 700; font-size: 15.5px; color: var(--text); line-height: 1.3; }
  .badge-closest { display: inline-block; margin-left: 6px; font-size: 10px; background: var(--accent-tint); color: var(--accent); padding: 2px 7px; border-radius: 999px; font-weight: 700; vertical-align: middle; }
  .cc-route { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .cc-wait-pill {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; min-width: 60px;
  }
  .cc-wait-num { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .cc-wait-unit { font-size: 11px; font-weight: 600; color: var(--text-faint); margin-top: 2px; }
  .cc-wait-num.low { color: var(--green); }
  .cc-wait-num.mid { color: var(--amber); }
  .cc-wait-num.high { color: var(--red); }
  .cc-wait-num.none { color: var(--text-faint); font-size: 20px; }
  .cc-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: var(--text-faint); }
  .cc-trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
  .cc-trend.up { color: var(--red); }
  .cc-trend.down { color: var(--green); }
  .cc-lanes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .cc-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px;
  }
  .cc-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .cc-chip .dot.low { background: var(--green); }
  .cc-chip .dot.mid { background: var(--amber); }
  .cc-chip .dot.high { background: var(--red); }
  .cc-chip .dot.none { background: var(--text-faint); }
  .no-results { color: var(--text-faint); font-size: 13.5px; padding: 20px 4px; text-align: center; }

  /* ---------- Ticker ---------- */
  .ticker-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 6px; margin-bottom: 26px; box-shadow: var(--shadow); }
  .ticker-card h2 { font-size: 14px; font-weight: 700; margin: 0 0 10px; color: var(--text); }
  .ticker-item { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .ticker-item:first-child { border-top: none; }
  .ticker-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .ticker-dot.wait-low { background: var(--green); }
  .ticker-dot.wait-mid { background: var(--amber); }
  .ticker-dot.wait-high { background: var(--red); }
  .ticker-text b { color: var(--text); }
  .ticker-text { color: var(--text-dim); line-height: 1.45; }
  .ticker-time { color: var(--text-faint); font-size: 11.5px; margin-top: 2px; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 10px 0 14px; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(8,9,12,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 40; padding: 0; }
  .overlay.open { display: flex; }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .modal { background: var(--panel); border: 1px solid var(--line); width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; padding: 20px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .modal { border-radius: 20px; } }
  .modal h3 { font-size: 20px; font-weight: 800; margin: 0 0 3px; letter-spacing: -0.01em; }
  .modal .route { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); font-weight: 600; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  select, input[type="number"], input[type="text"], textarea { width: 100%; min-height: 44px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 0 12px; font-size: 15px; }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 64px; min-height: 44px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button.active { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
  .submit-btn { width: 100%; min-height: 48px; margin-top: 20px; padding: 0 13px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .submit-btn:active { transform: scale(0.99); }
  .close-btn { position: absolute; top: 10px; right: 10px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--text-faint); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-inner { position: relative; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--green); color: #06231a; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { text-align: center; margin-top: 6px; }
  footer button { background: none; border: none; color: var(--text-faint); font-size: 11.5px; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 6px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row">
      <div>
        <h1 data-i18n="title">Crossing Times</h1>
        <p class="tagline" data-i18n="tagline">Live border wait reports from people actually at the crossing.</p>
      </div>
      <div class="lang-switch">
        <select id="lang-select" aria-label="Language"></select>
      </div>
    </div>
    <p class="proto-note" data-i18n="protoNote">Reports currently save on this device only.</p>
  </header>

  <div class="mapcard">
    <div class="mapcard-head">
      <h2 data-i18n="mapHead">Border crossings map</h2>
      <span data-i18n="mapHint">tap a pin</span>
    </div>
    <div class="locate-row">
      <button class="locate-btn" id="locate-btn" data-i18n="locateBtn">Use my location</button>
      <span class="locate-status" id="locate-status"></span>
    </div>
    <div class="mapbox" id="mapbox"></div>
    <div class="map-legend">
      <span class="legend-pill"><i style="background:var(--text-faint)"></i><span data-i18n="legendNone">No reports yet</span></span>
      <span class="legend-pill"><i style="background:var(--green)"></i><span data-i18n="legendLow">0\u201315 min</span></span>
      <span class="legend-pill"><i style="background:var(--amber)"></i><span data-i18n="legendMid">15\u201345 min</span></span>
      <span class="legend-pill"><i style="background:var(--red)"></i><span data-i18n="legendHigh">45+ min</span></span>
    </div>
  </div>

  <div class="sticky-bar" id="sticky-bar">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="search-input" data-i18n-placeholder="searchPlaceholder">
    </div>
    <div class="filter-pills" id="filter-pills">
      <button class="filter-pill" data-filter="distance" data-i18n="sortNearest">Nearest</button>
      <button class="filter-pill" data-filter="shortest" data-i18n="filterShortest">Shortest wait</button>
      <button class="filter-pill" data-filter="commercial" data-i18n="filterCommercial">Commercial</button>
    </div>
  </div>

  <div class="board-section-head">
    <h2 data-i18n="boardHead">Current waits</h2>
    <span id="board-count"></span>
  </div>
  <div class="cards" id="board-rows"></div>

  <div class="ticker-card">
    <h2 data-i18n="tickerHead">Recent reports</h2>
    <div id="ticker"></div>
  </div>

  <footer>
    <button id="clear-data" data-i18n="footerClear">Clear demo data on this device</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="close-btn" id="close-modal" aria-label="Close">&times;</button>
      <h3 id="modal-title" data-i18n="modalTitle">Report a wait</h3>
      <div class="route" id="modal-route"></div>

      <label for="crossing-select" data-i18n="labelCrossing">Crossing</label>
      <select id="crossing-select"></select>

      <label data-i18n="labelDirection">Direction</label>
      <div class="seg" id="direction-seg"></div>

      <label for="minutes-input" data-i18n="labelWait">Wait time (minutes)</label>
      <input type="number" id="minutes-input" min="0" max="600">

      <label data-i18n="labelVehicle">Vehicle</label>
      <div class="seg" id="vehicle-seg"></div>

      <label for="note-input" data-i18n="labelNote">Note (optional)</label>
      <input type="text" id="note-input" maxlength="80">

      <button class="submit-btn" id="submit-report" data-i18n="submitBtn">Submit report</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Report added</div>

      card.addEventListener("click", function () { openModal(p.c.id); });

      var waitClass = p.avg ? bucket(p.avg.minutes) : "none";
      var waitNum = p.avg ? p.avg.minutes : "\u2014";
      var closest = (activeFilter === "distance" && userLoc && idx === 0) ? ' <span class="badge-closest">' + t("closestBadge") + "</span>" : "";

      var metaParts = [];
      metaParts.push('<span>' + (p.avg ? t("updatedPrefix") + " " + relTime(p.avg.latest) : t("legendNone")) + '</span>');
      if (userLoc && p.dist !== null) metaParts.push('<span>' + distanceText(p.dist) + '</span>');
      if (p.trend !== null) {
        var trendClass = p.trend > 0 ? "up" : "down";
        var arrow = p.trend > 0 ? "\u2191" : "\u2193";
        var deltaText = (p.trend > 0 ? "+" : "") + p.trend + " min " + t("vsLastHour");
        metaParts.push('<span class="cc-trend ' + trendClass + '">' + arrow + " " + deltaText + '</span>');
      }

      var chips = VEHICLE_TYPES.map(function (v) {
        var va = avgWaitByVehicle(p.c.id, v);
        var vClass = va ? bucket(va.minutes) : "none";
        var vText = va ? va.minutes + "m" : "\u2014";
        return '<span class="cc-chip"><span class="dot ' + vClass + '"></span>' + vehicleLabel(v) + " " + vText + "</span>";
      }).join("");

      card.innerHTML =
        '<div class="cc-top">' +
          '<div><div class="cc-name">' + p.c.name + closest + '</div>' +
          '<div class="cc-route">' + countryName(p.c.a) + " \u2194 " + countryName(p.c.b) + '</div></div>' +
          '<div class="cc-wait-pill"><div class="cc-wait-num ' + waitClass + '">' + waitNum + '</div>' +
          (p.avg ? '<div class="cc-wait-unit">min</div>' : '') + '</div>' +
        '</div>' +
        '<div class="cc-meta">' + metaParts.join("") + '</div>' +
        '<div class="cc-lanes">' + chips + '</div>';
      boardRows.appendChild(card);
    });
  }

  function buildTicker() {
    var recent = reports.slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 12);
    if (!recent.length) { ticker.innerHTML = '<div class="empty">' + t("tickerEmpty") + "</div>"; return; }
    ticker.innerHTML = "";
    recent.forEach(function (r) {
      var c = CROSSINGS.find(function (x) { return x.id === r.crossingId; });
      if (!c) return;
      var dirText = r.direction === 0 ? (countryName(c.a) + " \u2192 " + countryName(c.b)) : (countryName(c.b) + " \u2192 " + countryName(c.a));
      var item = document.createElement("div");
      item.className = "ticker-item";
      item.innerHTML =
        '<div class="ticker-dot wait-' + bucket(r.minutes) + '"></div>' +
        '<div class="ticker-text"><b>' + c.name + "</b> \u2014 " + r.minutes + " min, " + vehicleLabel(r.vehicle) + ", " + dirText +
        (r.note ? ' <span style="color:var(--text-faint)">\u201c' + escapeHtml(r.note) + '\u201d</span>' : "") +
        '<div class="ticker-time">' + relTime(r.ts) + "</div></div>";
      ticker.appendChild(item);
    });
  }
  function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function renderAll() { buildMap(); buildBoard(); buildTicker(); }

  /* ---------------- Modal ---------------- */
  function populateCrossingSelect(selectedId) {
    crossingSelect.innerHTML = "";
    CROSSINGS.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.name;
      if (c.id === selectedId) opt.selected = true;
      crossingSelect.appendChild(opt);
    });
  }
  function updateDirectionSeg(crossingId) {
    var c = CROSSINGS.find(function (x) { return x.id === crossingId; });
    directionSeg.innerHTML = "";
    [0, 1].forEach(function (dir) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = dir === 0 ? (countryName(c.a) + " \u2192 " + countryName(c.b)) : (countryName(c.b) + " \u2192 " + countryName(c.a));
      if (dir === selectedDirection) btn.className = "active";
      btn.addEventListener("click", function () { selectedDirection = dir; updateDirectionSeg(crossingId); });
      directionSeg.appendChild(btn);
    });
  }
  function buildVehicleSeg() {
    vehicleSeg.innerHTML = "";
    VEHICLE_TYPES.forEach(function (v) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.dataset.v = v; btn.textContent = vehicleLabel(v);
      if (v === selectedVehicle) btn.className = "active";
      btn.addEventListener("click", function () {
        selectedVehicle = v;
        Array.prototype.forEach.call(vehicleSeg.children, function (b) { b.classList.toggle("active", b === btn); });
      });
      vehicleSeg.appendChild(btn);
    });
  }
  function openModal(crossingId) {
    selectedDirection = 0; selectedVehicle = "car";
    populateCrossingSelect(crossingId);
    var c = CROSSINGS.find(function (x) { return x.id === crossingId; });
    modalRoute.textContent = routeText(c);
    updateDirectionSeg(crossingId);
    buildVehicleSeg();
    minutesInput.value = ""; minutesInput.placeholder = t("minutesPlaceholder");
    noteInput.value = ""; noteInput.placeholder = t("notePlaceholder");
    overlay.classList.add("open");
    setTimeout(function () { minutesInput.focus(); }, 50);
  }
  function closeModal() { overlay.classList.remove("open"); }
  document.getElementById("close-modal").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  crossingSelect.addEventListener("change", function () {
    selectedDirection = 0;
    updateDirectionSeg(crossingSelect.value);
    var c = CROSSINGS.find(function (x) { return x.id === crossingSelect.value; });
    modalRoute.textContent = routeText(c);
  });

  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1800); }

  document.getElementById("submit-report").addEventListener("click", function () {
    var minutes = parseInt(minutesInput.value, 10);
    if (isNaN(minutes) || minutes < 0) {
      minutesInput.focus(); minutesInput.style.outline = "2px solid var(--red)";
      setTimeout(function () { minutesInput.style.outline = ""; }, 900);
      return;
    }
    reports.push({ id: "r" + Date.now() + Math.random().toString(36).slice(2, 7), crossingId: crossingSelect.value, minutes: minutes, direction: selectedDirection, vehicle: selectedVehicle, note: noteInput.value.trim().slice(0, 80), ts: Date.now() });
    saveReports(reports);
    closeModal(); renderAll(); showToast(t("toastAdded"));
  });
  document.getElementById("clear-data").addEventListener("click", function () {
    reports = []; saveReports(reports); renderAll(); showToast(t("toastCleared"));
  });

  /* ---------------- Geolocation ---------------- */
  function locate() {
    if (!("geolocation" in navigator)) { locateStatus.textContent = t("locationError"); return; }
    locateBtn.disabled = true;
    locateStatus.textContent = t("locating");
    navigator.geolocation.getCurrentPosition(function (pos) {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locateBtn.disabled = false;
      locateStatus.textContent = "";
      activeFilter = "distance";
      updateFilterPills();
      if (leafletMap) {
        if (userMarker) leafletMap.removeLayer(userMarker);
        userMarker = L.marker([userLoc.lat, userLoc.lng], { icon: userIcon(), zIndexOffset: 1000 }).addTo(leafletMap);
        leafletMap.setView([userLoc.lat, userLoc.lng], 7);
      }
      renderAll();
    }, function (err) {
      locateBtn.disabled = false;
      locateStatus.textContent = (err && err.code === 1) ? t("locationDenied") : t("locationError");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }
  locateBtn.addEventListener("click", locate);

  /* ---------------- Search & filter pills ---------------- */
  function updateFilterPills() {
    Array.prototype.forEach.call(filterPills.children, function (b) { b.classList.toggle("active", b.dataset.filter === activeFilter); });
  }
  filterPills.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var key = btn.dataset.filter;
    if (key === "distance" && !userLoc) { locate(); return; }
    activeFilter = (activeFilter === key) ? null : key;
    updateFilterPills();
    buildBoard();
  });
  searchInput.addEventListener("input", function () {
    searchQuery = searchInput.value.trim();
    buildBoard();
  });
  window.addEventListener("scroll", function () {
    stickyBar.classList.toggle("scrolled", window.scrollY > 4);
  });

  /* ---------------- i18n wiring ---------------- */
  function applyStaticTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var val = t(key);
      if (typeof val === "string") el.textContent = val;
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-placeholder");
      var val = t(key);
      if (typeof val === "string") el.placeholder = val;
    });
    document.getElementById("html-root").lang = currentLang;
    minutesInput.placeholder = t("minutesPlaceholder");
    noteInput.placeholder = t("notePlaceholder");
    updateFilterPills();
  }
  function populateLangSelect() {
    langSelect.innerHTML = "";
    Object.keys(UI).forEach(function (code) {
      var opt = document.createElement("option");
      opt.value = code; opt.textContent = LANG_NAMES[code] || code;
      if (code === currentLang) opt.selected = true;
      langSelect.appendChild(opt);
    });
  }
  langSelect.addEventListener("change", function () {
    currentLang = langSelect.value;
    try { localStorage.setItem("borderwait_lang_v1", currentLang); } catch (e) {}
    applyStaticTranslations();
    renderAll();
  });

  window.addEventListener("resize", function () { if (leafletMap) leafletMap.invalidateSize(); });

  /* ---------------- Init ---------------- */
  populateLangSelect();
  applyStaticTranslations();
  renderAll();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
