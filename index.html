<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossing Times — European border wait reports</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#14171d">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #14171d;
    --panel: #1c2029;
    --panel-2: #232834;
    --line: #2e3440;
    --text: #eceef2;
    --text-dim: #9aa3b2;
    --text-faint: #626a7a;
    --amber: #f0a93c;
    --amber-dim: #6b5426;
    --green: #3fae7a;
    --green-dim: #234a37;
    --red: #e2572b;
    --red-dim: #5c2a1a;
    --blue: #2f8fe0;
    --board: #0d1015;
    --board-text: #f0a93c;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef0f3; --panel: #ffffff; --panel-2: #f5f6f8; --line: #dde1e7;
      --text: #1a1d24; --text-dim: #545c6b; --text-faint: #8890a0;
      --board: #14171d; --board-text: #f0a93c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --panel: #1c2029; --panel-2: #232834; --line: #2e3440;
    --text: #eceef2; --text-dim: #9aa3b2; --text-faint: #626a7a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; }

  header { margin-bottom: 22px; }
  .eyebrow-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(30px, 6vw, 42px); letter-spacing: 0.2px; margin: 0 0 6px; line-height: 1.02; }
  .tagline { color: var(--text-dim); font-size: 14.5px; max-width: 56ch; line-height: 1.5; margin: 0; }
  .proto-note { margin-top: 10px; font-size: 12.5px; color: var(--text-faint); border-left: 2px solid var(--amber); padding-left: 9px; }
  .lang-switch select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; cursor: pointer;
  }

  .mapcard { position: relative; background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 22px 0 26px; }
  .mapcard-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
  .mapcard-head h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; margin: 0; color: var(--text-dim); }
  .mapcard-head span { font-size: 11.5px; color: var(--text-faint); }
  .locate-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px; flex-wrap: wrap; }
  .locate-btn { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .locate-btn:disabled { opacity: 0.55; cursor: default; }
  .locate-status { font-size: 11.5px; color: var(--text-faint); }
  .mapbox { position: relative; width: 100%; aspect-ratio: 10 / 7; z-index: 0; }
  .mapbox .leaflet-container { width: 100%; height: 100%; background: var(--panel-2); font-family: inherit; }
  .mapbox .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border-radius: 10px; }
  .mapbox .leaflet-popup-tip { background: var(--panel); }
  .mapbox .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 13px; margin: 10px 12px; }
  .mapbox .leaflet-popup-content b { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; }
  .crossing-marker { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #0d0f13; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .crossing-marker.wait-none { background: var(--text-faint); }
  .crossing-marker.wait-low { background: var(--green); }
  .crossing-marker.wait-mid { background: var(--amber); }
  .crossing-marker.wait-high { background: var(--red); }
  .user-marker-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 5px rgba(47,143,224,0.3); }

  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px 14px; font-size: 11px; color: var(--text-faint); }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .map-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .board { background: var(--board); border-radius: 14px; padding: 6px 0; margin-bottom: 26px; border: 1px solid var(--line); }
  .board-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 10px; border-bottom: 1px solid #262a33; flex-wrap: wrap; gap: 8px; }
  .board-head h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; margin: 0; color: #cfd4dc; }
  .board-head-right { display: flex; align-items: center; gap: 10px; }
  .board-head span.count { font-size: 11px; color: #6a7181; }
  .sort-toggle { display: flex; gap: 6px; }
  .sort-toggle button { padding: 5px 10px; border-radius: 7px; border: 1px solid #2b2f39; background: #191c24; color: #9aa3b2; font-size: 11.5px; cursor: pointer; font-family: inherit; }
  .sort-toggle button.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #21242c; background: transparent; border-left: none; border-right: none; border-top: none; width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #191c24; }
  .row-name { font-weight: 600; font-size: 14.5px; color: #eceef2; }
  .row-route { font-size: 12px; color: #6a7181; margin-top: 1px; }
  .row-distance { font-size: 11px; color: #4d84b5; margin-top: 1px; }
  .badge-closest { display: inline-block; margin-left: 6px; font-size: 10px; background: var(--amber-dim); color: var(--amber); padding: 1px 6px; border-radius: 999px; font-weight: 700; vertical-align: middle; }
  .row-wait { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; color: var(--board-text); min-width: 64px; text-align: right; }
  .row-wait.none { color: #4a5060; font-size: 15px; }
  .row-updated { font-size: 10.5px; color: #565d6c; text-align: right; min-width: 58px; }

  .ticker-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 6px; margin-bottom: 26px; }
  .ticker-card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; margin: 0 0 10px; color: var(--text-dim); }
  .ticker-item { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .ticker-item:first-child { border-top: none; }
  .ticker-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .ticker-dot.wait-low { background: var(--green); }
  .ticker-dot.wait-mid { background: var(--amber); }
  .ticker-dot.wait-high { background: var(--red); }
  .ticker-text b { color: var(--text); }
  .ticker-text { color: var(--text-dim); line-height: 1.45; }
  .ticker-time { color: var(--text-faint); font-size: 11.5px; margin-top: 2px; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 10px 0 14px; }

  .overlay { position: fixed; inset: 0; background: rgba(8,9,12,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 40; padding: 0; }
  .overlay.open { display: flex; }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .modal { background: var(--panel); border: 1px solid var(--line); width: 100%; max-width: 460px; border-radius: 16px 16px 0 0; padding: 20px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .modal { border-radius: 16px; } }
  .modal h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 3px; }
  .modal .route { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); font-weight: 500; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  select, input[type="number"], input[type="text"], textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 10px 12px; font-size: 15px; font-family: inherit; }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 64px; padding: 9px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .seg button.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .submit-btn { width: 100%; margin-top: 20px; padding: 13px; border-radius: 10px; border: none; background: var(--amber); color: #1a1400; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .submit-btn:active { transform: scale(0.99); }
  .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px; }
  .modal-inner { position: relative; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--green); color: #06231a; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { text-align: center; margin-top: 6px; }
  footer button { background: none; border: none; color: var(--text-faint); font-size: 11.5px; text-decoration: underline; cursor: pointer; padding: 6px; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row">
      <div>
        <h1 data-i18n="title">Crossing Times</h1>
        <p class="tagline" data-i18n="tagline">Live border wait reports from people actually at the crossing.</p>
      </div>
      <div class="lang-switch">
        <select id="lang-select" aria-label="Language"></select>
      </div>
    </div>
    <p class="proto-note" data-i18n="protoNote">Reports currently save on this device only.</p>
  </header>

  <div class="mapcard">
    <div class="mapcard-head">
      <h2 data-i18n="mapHead">Border crossings map</h2>
      <span data-i18n="mapHint">tap a pin</span>
    </div>
    <div class="locate-row">
      <button class="locate-btn" id="locate-btn" data-i18n="locateBtn">Use my location</button>
      <span class="locate-status" id="locate-status"></span>
    </div>
    <div class="mapbox" id="mapbox"></div>
    <div class="map-legend">
      <span><i style="background:var(--text-faint)"></i> <span data-i18n="legendNone">No reports yet</span></span>
      <span><i style="background:var(--green)"></i> <span data-i18n="legendLow">Under 20 min</span></span>
      <span><i style="background:var(--amber)"></i> <span data-i18n="legendMid">20–60 min</span></span>
      <span><i style="background:var(--red)"></i> <span data-i18n="legendHigh">Over 60 min</span></span>
    </div>
  </div>

  <div class="board">
    <div class="board-head">
      <h2 data-i18n="boardHead">Current waits</h2>
      <div class="board-head-right">
        <div class="sort-toggle" id="sort-toggle">
          <button data-mode="wait" class="active" data-i18n="sortBusiest">Busiest</button>
          <button data-mode="distance" data-i18n="sortNearest">Nearest</button>
        </div>
        <span class="count" id="board-count"></span>
      </div>
    </div>
    <div id="board-rows"></div>
  </div>

  <div class="ticker-card">
    <h2 data-i18n="tickerHead">Recent reports</h2>
    <div id="ticker"></div>
  </div>

  <footer>
    <button id="clear-data" data-i18n="footerClear">Clear demo data on this device</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="close-btn" id="close-modal" aria-label="Close">&times;</button>
      <h3 id="modal-title" data-i18n="modalTitle">Report a wait</h3>
      <div class="route" id="modal-route"></div>

      <label for="crossing-select" data-i18n="labelCrossing">Crossing</label>
      <select id="crossing-select"></select>

      <label data-i18n="labelDirection">Direction</label>
      <div class="seg" id="direction-seg"></div>

      <label for="minutes-input" data-i18n="labelWait">Wait time (minutes)</label>
      <input type="number" id="minutes-input" min="0" max="600">

      <label data-i18n="labelVehicle">Vehicle</label>
      <div class="seg" id="vehicle-seg"></div>

      <label for="note-input" data-i18n="labelNote">Note (optional)</label>
      <input type="text" id="note-input" maxlength="80">

      <button class="submit-btn" id="submit-report" data-i18n="submitBtn">Submit report</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Report added</div>

  };
  var LANG_NAMES = { en:"English", de:"Deutsch", sr:"Srpski", mk:"\u041c\u0430\u043a\u0435\u0434\u043e\u043d\u0441\u043a\u0438", tr:"T\u00fcrk\u00e7e", el:"\u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac" };

  var currentLang = "en";
  try {
    var savedLang = localStorage.getItem("borderwait_lang_v1");
    if (savedLang && UI[savedLang]) currentLang = savedLang;
  } catch (e) {}

  function t(key) { var v = (UI[currentLang] || UI.en)[key]; return v === undefined ? UI.en[key] : v; }
  function countryName(code) { return (COUNTRIES[currentLang] || COUNTRIES.en)[code] || code; }
  function routeText(c) { return (ROUTE_TYPES[currentLang] || ROUTE_TYPES.en)[c.type] || ""; }

  /* ---------------- State & storage ---------------- */
  var STORE_KEY = "borderwait_reports_v1";
  var FOUR_HOURS = 4 * 60 * 60 * 1000;
  var sortMode = "wait";
  var userLoc = null;

  function loadReports() {
    try { var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
  }
  function saveReports(list) { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) {} }
  var reports = loadReports();

  function avgWait(crossingId) {
    var now = Date.now();
    var relevant = reports.filter(function (r) { return r.crossingId === crossingId && (now - r.ts) < FOUR_HOURS; });
    if (!relevant.length) return null;
    var sum = relevant.reduce(function (s, r) { return s + r.minutes; }, 0);
    return { minutes: Math.round(sum / relevant.length), latest: Math.max.apply(null, relevant.map(function (r) { return r.ts; })), count: relevant.length };
  }
  function bucket(min) { if (min === null) return "none"; if (min < 20) return "low"; if (min < 60) return "mid"; return "high"; }
  function relTime(ts) {
    var diff = Math.max(0, Date.now() - ts);
    var m = Math.round(diff / 60000);
    if (m < 1) return t("timeJustNow");
    if (m < 60) return t("timeMinAgo")(m);
    var h = Math.round(m / 60);
    if (h < 24) return t("timeHourAgo")(h);
    return t("timeDayAgo")(Math.round(h / 24));
  }
  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function distanceTo(c) {
    if (!userLoc) return null;
    return haversineKm(userLoc.lat, userLoc.lng, c.lat, c.lng);
  }
  function distanceText(km) {
    if (km < 1) return t("underKm");
    return t("kmAway")(Math.round(km));
  }

  var leafletMap = null;

  var userMarker = null;

  function iconFor(min) {

  }
  function userIcon() {
    return L.divIcon({ className: "", html: '<div class="user-marker-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  }
  function popupHtml(c, avg) {
    var waitText = avg ? avg.minutes + " min avg (" + avg.count + ")" : t("legendNone");

  }
  function initMap() {
    leafletMap = L.map("mapbox", { scrollWheelZoom: false }).setView([46, 20], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 18 }).addTo(leafletMap);
    CROSSINGS.forEach(function (c) {
      var marker = L.marker([c.lat, c.lng], { icon: iconFor(null) }).addTo(leafletMap);
      marker.bindPopup(popupHtml(c, null));
      marker.on("click", function () { openModal(c.id); });
      leafletMarkers[c.id] = marker;
    });
  }
  function buildMap() {
    if (!leafletMap) initMap();
    CROSSINGS.forEach(function (c) {
      var avg = avgWait(c.id);
      var marker = leafletMarkers[c.id];
      marker.setIcon(iconFor(avg ? avg.minutes : null));
      marker.setPopupContent(popupHtml(c, avg));
    });
  }

  /* ---------------- Board & ticker ---------------- */
  function buildBoard() {
    var rows = CROSSINGS.map(function (c) { return { c: c, avg: avgWait(c.id), dist: distanceTo(c) }; });
    if (sortMode === "distance" && userLoc) {
      rows.sort(function (p, q) { return p.dist - q.dist; });
    } else {
      rows.sort(function (p, q) { var av = p.avg ? p.avg.minutes : -1, bv = q.avg ? q.avg.minutes : -1; return bv - av; });
    }
    boardRows.innerHTML = "";
    boardCount.textContent = t("crossingsCount")(CROSSINGS.length);
    rows.forEach(function (p, idx) {
      var row = document.createElement("button");
      row.className = "row";
      row.addEventListener("click", function () { openModal(p.c.id); });
      var waitClass = p.avg ? "" : "none";
      var waitTextVal = p.avg ? p.avg.minutes + "m" : "\u2014";
      var closest = (sortMode === "distance" && userLoc && idx === 0) ? ' <span class="badge-closest">' + t("closestBadge") + "</span>" : "";
      var distLine = (userLoc && p.dist !== null) ? '<div class="row-distance">' + distanceText(p.dist) + "</div>" : "";
      row.innerHTML =
        '<div><div class="row-name">' + p.c.name + closest + '</div><div class="row-route">' + countryName(p.c.a) + " \u2194 " + countryName(p.c.b) + "</div>" + distLine + "</div>" +
        '<div class="row-wait ' + waitClass + '">' + waitTextVal + "</div>" +
        '<div class="row-updated">' + (p.avg ? relTime(p.avg.latest) : t("noData")) + "</div>";
      boardRows.appendChild(row);
    });
  }
  function buildTicker() {
    var recent = reports.slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 12);
    if (!recent.length) { ticker.innerHTML = '<div class="empty">' + t("tickerEmpty") + "</div>"; return; }
    ticker.innerHTML = "";
    recent.forEach(function (r) {
      var c = CROSSINGS.find(function (x) { return x.id === r.crossingId; });
      if (!c) return;
      var vehicleLabel = { car: t("vehicleCar"), truck: t("vehicleTruck"), bus: t("vehicleBus"), foot: t("vehicleFoot") }[r.vehicle] || r.vehicle;
      var dirText = r.direction === 0 ? (countryName(c.a) + " \u2192 " + countryName(c.b)) : (countryName(c.b) + " \u2192 " + countryName(c.a));
      var item = document.createElement("div");
      item.className = "ticker-item";
      item.innerHTML =
        '<div class="ticker-dot wait-' + bucket(r.minutes) + '"></div>' +
        '<div class="ticker-text"><b>' + c.name + "</b> \u2014 " + r.minutes + " min, " + vehicleLabel + ", " + dirText +
        (r.note ? ' <span style="color:var(--text-faint)">\u201c' + escapeHtml(r.note) + '\u201d</span>' : "") +
        '<div class="ticker-time">' + relTime(r.ts) + "</div></div>";
      ticker.appendChild(item);
    });
  }
  function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function renderAll() { buildMap(); buildBoard(); buildTicker(); }

  /* ---------------- Modal ---------------- */
  function populateCrossingSelect(selectedId) {
    crossingSelect.innerHTML = "";

    });

  function updateDirectionSeg(crossingId) {
    var c = CROSSINGS.find(function (x) { return x.id === crossingId; });
    directionSeg.innerHTML = "";
    [0, 1].forEach(function (dir) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = dir === 0 ? (countryName(c.a) + " \u2192 " + countryName(c.b)) : (countryName(c.b) + " \u2192 " + countryName(c.a));
      if (dir === selectedDirection) btn.className = "active";
      btn.addEventListener("click", function () { selectedDirection = dir; updateDirectionSeg(crossingId); });
      directionSeg.appendChild(btn);
    });
  }
  function buildVehicleSeg() {
    vehicleSeg.innerHTML = "";
    [["car", t("vehicleCar")], ["truck", t("vehicleTruck")], ["bus", t("vehicleBus")], ["foot", t("vehicleFoot")]].forEach(function (pair) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.dataset.v = pair[0]; btn.textContent = pair[1];
      if (pair[0] === selectedVehicle) btn.className = "active";
      btn.addEventListener("click", function () {
        selectedVehicle = pair[0];
        Array.prototype.forEach.call(vehicleSeg.children, function (b) { b.classList.toggle("active", b === btn); });
      });
      vehicleSeg.appendChild(btn);
    });
  }
  function openModal(crossingId) {
    selectedDirection = 0; selectedVehicle = "car";
    populateCrossingSelect(crossingId);
    var c = CROSSINGS.find(function (x) { return x.id === crossingId; });
    modalRoute.textContent = routeText(c);
    updateDirectionSeg(crossingId);
    buildVehicleSeg();
    minutesInput.value = ""; minutesInput.placeholder = t("minutesPlaceholder");
    noteInput.value = ""; noteInput.placeholder = t("notePlaceholder");
    overlay.classList.add("open");
    setTimeout(function () { minutesInput.focus(); }, 50);
  }
  function closeModal() { overlay.classList.remove("open"); }
  document.getElementById("close-modal").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  crossingSelect.addEventListener("change", function () {
    selectedDirection = 0;
    updateDirectionSeg(crossingSelect.value);
    var c = CROSSINGS.find(function (x) { return x.id === crossingSelect.value; });
    modalRoute.textContent = routeText(c);
  });

  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1800); }

  document.getElementById("submit-report").addEventListener("click", function () {
    var minutes = parseInt(minutesInput.value, 10);
    if (isNaN(minutes) || minutes < 0) {
      minutesInput.focus(); minutesInput.style.outline = "2px solid var(--red)";
      setTimeout(function () { minutesInput.style.outline = ""; }, 900);
      return;
    }
    reports.push({ id: "r" + Date.now() + Math.random().toString(36).slice(2, 7), crossingId: crossingSelect.value, minutes: minutes, direction: selectedDirection, vehicle: selectedVehicle, note: noteInput.value.trim().slice(0, 80), ts: Date.now() });
    saveReports(reports);
    closeModal(); renderAll(); showToast(t("toastAdded"));
  });
  document.getElementById("clear-data").addEventListener("click", function () {
    reports = []; saveReports(reports); renderAll(); showToast(t("toastCleared"));
  });

  /* ---------------- Geolocation ---------------- */
  function locate() {
    if (!("geolocation" in navigator)) { locateStatus.textContent = t("locationError"); return; }
    locateBtn.disabled = true;
    locateStatus.textContent = t("locating");
    navigator.geolocation.getCurrentPosition(function (pos) {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locateBtn.disabled = false;
      locateStatus.textContent = "";
      sortMode = "distance";
      updateSortToggle();
      if (leafletMap) {
        if (userMarker) leafletMap.removeLayer(userMarker);
        userMarker = L.marker([userLoc.lat, userLoc.lng], { icon: userIcon(), zIndexOffset: 1000 }).addTo(leafletMap);
        leafletMap.setView([userLoc.lat, userLoc.lng], 7);
      }
      renderAll();
    }, function (err) {
      locateBtn.disabled = false;
      locateStatus.textContent = (err && err.code === 1) ? t("locationDenied") : t("locationError");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }
  locateBtn.addEventListener("click", locate);

  function updateSortToggle() {
    Array.prototype.forEach.call(sortToggle.children, function (b) { b.classList.toggle("active", b.dataset.mode === sortMode); });
  }
  sortToggle.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.mode === "distance" && !userLoc) { locate(); return; }
    sortMode = btn.dataset.mode;
    updateSortToggle();
    buildBoard();
  });

  /* ---------------- i18n wiring ---------------- */
  function applyStaticTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var val = t(key);
      if (typeof val === "string") el.textContent = val;
    });
    document.getElementById("html-root").lang = currentLang;
    minutesInput.placeholder = t("minutesPlaceholder");
    noteInput.placeholder = t("notePlaceholder");
    updateSortToggle();
  }
  function populateLangSelect() {
    langSelect.innerHTML = "";
    Object.keys(UI).forEach(function (code) {
      var opt = document.createElement("option");
      opt.value = code; opt.textContent = LANG_NAMES[code] || code;
      if (code === currentLang) opt.selected = true;
      langSelect.appendChild(opt);
    });
  }
  langSelect.addEventListener("change", function () {
    currentLang = langSelect.value;
    try { localStorage.setItem("borderwait_lang_v1", currentLang); } catch (e) {}
    applyStaticTranslations();
    renderAll();
  });

  window.addEventListener("resize", function () { if (leafletMap) leafletMap.invalidateSize(); });

  /* ---------------- Init ---------------- */
  populateLangSelect();
  applyStaticTranslations();
  renderAll();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
